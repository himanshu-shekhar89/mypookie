spring:
  application:
    name: mypookie-api
  servlet:
    multipart:
      max-file-size: 35MB
      max-request-size: 36MB
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:mypookie;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  auth:
    firebase-enabled: ${FIREBASE_ENABLED:false}
    firebase-service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}
    admin-emails: ${ADMIN_EMAILS:himaanshushekharr.pvt@gmail.com,himanshushekharr.pvt@gmail.com}
    super-admin-emails: ${SUPER_ADMIN_EMAILS:himaanshushekharr.pvt@gmail.com,himanshushekharr.pvt@gmail.com}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-20b}
  gift-secret-key: ${GIFT_SECRET_KEY:}
